services:
  evalhub:
    build: ../EvalHub-course
    container_name: evalhub
    ports:
      - "8000:8000"
    environment:
      - EVALHUB_DB_PATH=/app/data/evalhub.db
    volumes:
      - evalhub_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  rageval:
    build: ../RAGEval
    container_name: rageval
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  evalagent:
    build: .
    container_name: evalagent
    depends_on:
      evalhub:
        condition: service_healthy
      rageval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evalhub_data: